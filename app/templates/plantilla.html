{% extends "./base.html" %}

{% block title %}Bienvenido{% endblock%}

{% block customCSS%}
  <link rel="stylesheet" href="{{url_for('static', filename='css/landing.css')}}">
{% endblock%}

{% block body%}
<div class="landing-container">
    <img src="{{ url_for('static', filename='img/logo_sin.png') }}" alt="Computing Store Logo">
    <h1>Tienda de Cursos de Computación Online</h1>
    
    <div class="d-flex flex-column flex-md-row justify-content-center align-items-center mt-4 gap-4">
        <a href="{{ url_for('login') }}" class="btn-custom btn-custom-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 8px;">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                <polyline points="10 17 15 12 10 7"></polyline>
                <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            Iniciar sesión
        </a>
        <a href="{{ url_for('sing_up') }}" class="btn-custom btn-custom-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 8px;">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            Regístrate
        </a>
    </div>
</div>
{% endblock %}
